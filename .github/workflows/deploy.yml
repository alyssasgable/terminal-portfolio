name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Blupi
    needs: build
    runs-on: [self-hosted, linux, ARM64, blupi]

    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: dist
      - name: Deploy website
        run: |
          rsync -rltD --no-perms --no-owner --no-group --omit-dir-times dist/ /var/www/alyssasvg/
          rsync -rltD --no-perms --no-owner --no-group --omit-dir-times --delete dist/assets/ /var/www/alyssasvg/assets/
      - name: Confirm deployment
        run: |
          echo "Portfolio successfully deployed!"
          ls -lh /var/www/alyssasvg/index.html
